[workspace]
resolver = "2"
members = ["crates/cache", "crates/ipc", "crates/cryptography", "crates/primitives", "crates/storage", "crates/svd-oms", "crates/svd-pretrade", "crates/svd-settlement", "crates/svd-sync", "crates/util", "crates/svd-query", "crates/svd-pubsub"]

[workspace.dependencies]
# The members pick the alloy feature set explicitly (see
# svd-settlement/Cargo.toml).
alloy = { version = "2.5.0", default-features = false }
serde = "1.0.229"
rmp-serde = "1.3.1"
slab = "0.4.12"
rustc-hash = "2.1.3"
litemap = "0.8.3"
memmap2 = "0.9.11"
redis = { version = "1.7", features = ["cluster", "tokio-comp"] }
# The default features pull in the CDLA-licensed TLS/websockets stack; the
# ring provider keeps the build free of aws-lc (no cmake requirement).
async-nats = { version = "0.50", default-features = false, features = ["ring", "jetstream", "nuid"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "macros"] }
toml = "1"
signal-hook = "0.4"
crc32fast = "1"
core_affinity = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-queue = "0.3"
axum = "0.8"
serde_json = "1"
k256 = "0.13"
sha3 = "0.12"
