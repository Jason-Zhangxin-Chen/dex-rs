# cargo-deny – audit third-party dependencies for licenses, advisories,
# sources, and duplicate versions.  Run with `cargo deny check`.

# ============================================================================
# Licenses – only allow well-known permissive / weak-copyleft licenses.
# ============================================================================
[licenses]
version = 2
confidence-threshold = 0.8

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",          # Boost Software License
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    # The rustls root store (webpki-root-certs): a permissive data
    # license, the standard companion of the rustls TLS stack that the
    # alloy transport uses (mirrors the async-nats `ring` choice of
    # avoiding the aws-lc build).
    "CDLA-Permissive-2.0",
]

exceptions = [
    # Each entry: { name = "crate", allow = ["reason"] }
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ============================================================================
# Bans – deny specific crates or crate patterns.
# ============================================================================
[bans]
multiple-versions = "warn"
deny = [
    # Duplicates of what std/rustc already provides.
    # Uncomment when these creep in:
    # "rustc-serialize",
]

wildcards = "deny"
highlight = "all"

[[bans.skip]]
name = "syn"
wrappers = []
reason = "Standard library-in-the-making crate — many versions are normal."

[[bans.skip]]
name = "windows-sys"
wrappers = []
reason = "Many versions are normal for windows-sys."

[[bans.skip]]
name = "windows-targets"
wrappers = []
reason = "Many versions are normal for windows-targets."

# ============================================================================
# Sources – only crates.io is allowed by default.
# ============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# ============================================================================
# Advisories – deny crates with known security vulnerabilities.
# ============================================================================
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
db-path = "~/.cargo/advisory-db"
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
    # The Marvin Attack timing side-channel in the RustCrypto `rsa` crate.
    # No fixed release exists upstream; sqlx-mysql uses `rsa` only for the
    # MySQL caching_sha2_password auth handshake, never for the operator
    # key material (that path is k256-only). Revisit when RustCrypto ships
    # a fix or sqlx drops the dependency.
    "RUSTSEC-2023-0071",
]
